name: Sync YouTube courses

on:
  # Manual only — the weekly schedule lives on the raspi cron instead
  # (see scripts/README.md), so this doesn't double-run the sync (and
  # double-spend YouTube API quota / send duplicate digest emails) every
  # Monday. Kept for ad-hoc runs and as a documented fallback.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run YouTube sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-youtube.ts
        # Writes land as status: pending — review happens in the admin
        # panel, not as a PR (spec: content-ingestion — "YouTube sync
        # writes pending records, review moves to the admin panel").
